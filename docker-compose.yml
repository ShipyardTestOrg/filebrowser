# Generated by curious
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    # QA fix: the image runs as non-root UID 1000 and its entrypoint writes to /config
    # /srv /database. On k8s the persistent-volume mounts come up root-owned (Shipyard sets
    # no pod-level fsGroup), so the non-root user can't write them → CrashLoopBackOff
    # ("cp: can't create '/config/settings.json': Permission denied"). Local Docker masks
    # this because named volumes inherit the image's chowned dir ownership. Run as root so
    # it can write the root-owned mounts. NOTE: `user:` (→ k8s runAsUser) is used rather than
    # the shipyard.securityContext label because that label is only honored for REMOTE
    # projects (build.py:3997 nulls it otherwise) — the compose user field applies to all
    # deploys. "root" (not "0") so the image's busybox `id -u` can resolve it.
    # (Finding F10: Shipyard has no pod-level fsGroup support.)
    user: "root"
    ports:
      - 8000:80
    volumes:
      - filebrowser-srv:/srv
      - filebrowser-config:/config
      - filebrowser-database:/database
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:80/health
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
      shipyard.readiness.http.path: /health
    environment:
      FB_PORT: "80"
volumes:
  filebrowser-srv:
    labels:
      shipyard.deploy.disk.size: 2Gi
  filebrowser-config:
    labels:
      shipyard.deploy.disk.size: 2Gi
  filebrowser-database:
    labels:
      shipyard.deploy.disk.size: 2Gi
