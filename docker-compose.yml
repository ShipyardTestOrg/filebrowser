# Generated by curious
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    # QA note: the image runs as non-root UID 1000 and writes to /config /srv /database.
    # Those paths were originally persistent-volume mounts, but on k8s a PV mount comes up
    # root-owned and Shipyard sets no pod-level fsGroup, so the non-root app crashed
    # ("open /database/filebrowser.db: permission denied" — the entrypoint even drops
    # privileges to UID 1000 after setup, so running as root doesn't help). Dropping the
    # mounts lets filebrowser use the image's own dirs (chowned to UID 1000 in the
    # Dockerfile), which the app can write. Trade-off: data is not persisted across pod
    # restarts. The persistent + non-root version needs pod-level fsGroup (Shipyard
    # Finding F10 → shipyard PR danielle/pod-security-context): once that ships, re-add the
    # volumes plus `shipyard.podSecurityContext: '{"fsGroup": 1000}'`.
    ports:
      - 8000:80
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:80/health
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
      shipyard.readiness.http.path: /health
    environment:
      FB_PORT: "80"
